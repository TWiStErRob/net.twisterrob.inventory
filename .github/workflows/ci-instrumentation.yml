name: "🧪 Instrumentation Test Matrix"

on:
  workflow_call:

jobs:

  instrumentation:
    name: "${{ matrix.api }}"

    uses: TWiStErRob/github-workflows/.github/workflows/instrumentation.yml@104620e2c495f0c905fde6f15ea2b6453ae4eaed # v3
    with:
      android-api: ${{ matrix.api }}
      java-version: 21
      timeout-minutes: 60
      script: |
        # Workaround for :android:connectedDebugAndroidTest's output:
        # > additionalTestOutput is not supported on this device running API level 21 because the additional test output directory could not be found
        ./.github/workflows/scripts/adb-shell-create-sdcard-android-dir.sh ${{ matrix.api }}

        # AGP 9.4.1 asks API 21's `am` for a current-user command it does not support.
        # Keep additional output enabled so failure screenshots and SVG ZIPs are collected.
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK not configured}}"
        sdk_shadow="$(mktemp -d)"
        for entry in "$sdk_root"/*; do
          [[ "${entry##*/}" == platform-tools ]] || ln -s "$entry" "$sdk_shadow/${entry##*/}"
        done
        mkdir "$sdk_shadow/platform-tools"
        for entry in "$sdk_root/platform-tools"/*; do
          [[ "${entry##*/}" == adb ]] || ln -s "$entry" "$sdk_shadow/platform-tools/${entry##*/}"
        done
        install -m 755 ./.github/workflows/scripts/adb-api21-current-user.sh "$sdk_shadow/platform-tools/adb"
        export INVENTORY_REAL_ADB="$sdk_root/platform-tools/adb"
        export ANDROID_HOME="$sdk_shadow" ANDROID_SDK_ROOT="$sdk_shadow"
        
        # Used by net.twisterrob.android.test.SystemAnimations
        #adb shell pm grant ${packageName} android.permission.SET_ANIMATION_SCALE
        # to set these:
        adb shell settings put global window_animation_scale 0
        adb shell settings put global transition_animation_scale 0
        adb shell settings put global animator_duration_scale 0
        
        # Used by net.twisterrob.android.test.DeviceUnlocker
        #adb shell pm grant ${packageName} android.permission.DISABLE_KEYGUARD
        
        # TODO move to TestRule?
        #adb shell pm grant ${packageName} android.permission.WRITE_SECURE_SETTINGS
        adb shell settings put secure long_press_timeout 1500
        
        ./gradlew --no-daemon --stacktrace :android:connectedCheck -Pnet.twisterrob.android.test.SkipOnCI=true
        ./gradlew --no-daemon --stacktrace :android:data:svg:connectedCheck

    permissions:
      contents: read
      checks: write
      statuses: write

    strategy:
      fail-fast: false
      matrix:
        # The API level, see https://apilevels.com/.
        api:
          - 21 # A stable version for now.
