org.gradle.warning.mode=fail
org.gradle.kotlin.dsl.allWarningsAsErrors=true

org.gradle.jvmargs=-Xmx2048M -Dorg.gradle.deprecation.trace=true

org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache-problems=fail
org.gradle.configuration-cache.quiet=true

android.useAndroidX=true

# TODEL https://issuetracker.google.com/issues/37056080#comment14
# See gradle/plugins-inventory/src/main/kotlin/net/twisterrob/inventory/build/tests/instrumentation.gradle.kts
android.experimental.androidTest.builtin_test_platform=true

# Do not commit empty baseline files, assume everything is clean unless we have a baseline file.
android.experimental.lint.missingBaselineIsEmptyBaseline=true

android.suppressUnsupportedOptionWarnings=\
  android.experimental.androidTest.builtin_test_platform,\
  android.experimental.lint.missingBaselineIsEmptyBaseline,\
  android.suppressUnsupportedOptionWarnings

# TODO disable this and fix all the R classes.
android.nonTransitiveRClass=false
